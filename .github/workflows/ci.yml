name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src

      - name: Test with branch coverage
        run: pytest

      - name: End-to-end RL Benders smoke
        run: |
          rl-benders train \
            --facilities 3 --customers 3 --scenarios 3 \
            --instances 2 --episodes 3 --seed 700 \
            --max-policy-decisions 20 \
            --checkpoint /tmp/q-policy.npz \
            --output-report /tmp/training.json
          rl-benders solve \
            --facilities 3 --customers 3 --scenarios 3 \
            --seed 900 --mode q --checkpoint /tmp/q-policy.npz
