[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reinforcement-learning-benders-decomposition"
version = "0.1.0"
description = "Certified Benders decomposition with reinforcement-learning cut-batch control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "jorsacademy" }]
keywords = [
  "operations research",
  "benders decomposition",
  "reinforcement learning",
  "stochastic programming",
  "facility location",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
rl-benders = "rl_benders.cli:main"

[project.urls]
Repository = "https://github.com/jorsacademy/reinforcement-learning-benders-decomposition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=rl_benders",
  "--cov-report=term-missing",
  "--cov-branch",
  "--cov-fail-under=84",
]

[tool.coverage.run]
branch = true
source = ["rl_benders"]
omit = ["src/rl_benders/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["rl_benders"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rl_benders"]
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
